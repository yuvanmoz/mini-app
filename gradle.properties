# Project-wide Gradle settings.

# AndroidX migration - required for all modern Android dependencies
android.useAndroidX=true

# Suppress warning about AGP 8.5.2 and compileSdk=35/36
android.suppressUnsupportedCompileSdk=35,36

# Enables the Kotlin Incremental compilation
kotlin.incremental=true

# Kotlin/JVM target bytecode version
kotlin.jvm.target.validation.mode=IGNORE

# Increase heap size for large projects
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use Gradle daemon for faster subsequent builds
org.gradle.daemon=true

# Parallel execution
org.gradle.parallel=true

# Jetpack Compose compiler metrics (optional)
# compose.generateCompilerMetrics=true
